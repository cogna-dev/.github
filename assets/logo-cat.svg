<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ede9fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd6fe;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#a78bfa" stroke-width="3" opacity="0.5" />

  <!-- Subtle grid / code pattern in background -->
  <g opacity="0.07" stroke="#a78bfa" stroke-width="1">
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
    <line x1="60" y1="340" x2="340" y2="340"/>
    <line x1="60" y1="60" x2="60" y2="340"/>
    <line x1="340" y1="60" x2="340" y2="340"/>
  </g>

  <!-- Small decorative code brackets -->
  <text x="52" y="215" font-family="monospace" font-size="36" fill="#a78bfa" opacity="0.25" font-weight="bold">{</text>
  <text x="330" y="215" font-family="monospace" font-size="36" fill="#a78bfa" opacity="0.25" font-weight="bold">}</text>

  <!-- ===== CAT BODY ===== -->

  <!-- Main body -->
  <ellipse cx="200" cy="268" rx="65" ry="75" fill="url(#bodyGrad)" />

  <!-- Belly -->
  <ellipse cx="200" cy="280" rx="40" ry="55" fill="url(#bellyGrad)" />

  <!-- Tail -->
  <path d="M262,300 Q310,280 315,240 Q318,210 295,205 Q285,205 284,215 Q290,218 288,230 Q284,260 255,275" fill="#7c3aed" stroke="#6d28d9" stroke-width="1" />

  <!-- Front legs -->
  <ellipse cx="170" cy="328" rx="15" ry="22" fill="#7c3aed" />
  <ellipse cx="230" cy="328" rx="15" ry="22" fill="#7c3aed" />
  <!-- Paws -->
  <ellipse cx="170" cy="346" rx="17" ry="8" fill="#6d28d9" />
  <ellipse cx="230" cy="346" rx="17" ry="8" fill="#6d28d9" />
  <!-- Toe lines -->
  <g stroke="#5b21b6" stroke-width="1.2" fill="none" opacity="0.8">
    <line x1="163" y1="347" x2="163" y2="352"/>
    <line x1="170" y1="349" x2="170" y2="354"/>
    <line x1="177" y1="347" x2="177" y2="352"/>
    <line x1="223" y1="347" x2="223" y2="352"/>
    <line x1="230" y1="349" x2="230" y2="354"/>
    <line x1="237" y1="347" x2="237" y2="352"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="186" rx="60" ry="56" fill="url(#bodyGrad)" />

  <!-- Pointy ears -->
  <polygon points="158,155 145,110 182,148" fill="#7c3aed" />
  <polygon points="160,153 148,114 181,146" fill="#a78bfa" opacity="0.5"/>
  <!-- Inner ear -->
  <polygon points="162,150 154,120 178,144" fill="#f0abfc" opacity="0.7"/>

  <polygon points="242,155 255,110 218,148" fill="#7c3aed" />
  <polygon points="240,153 252,114 219,146" fill="#a78bfa" opacity="0.5"/>
  <!-- Inner ear -->
  <polygon points="238,150 246,120 222,144" fill="#f0abfc" opacity="0.7"/>

  <!-- Face fur pattern (stripes) -->
  <g stroke="#8b5cf6" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M175,165 Q180,158 185,165"/>
    <path d="M215,165 Q220,158 225,165"/>
  </g>

  <!-- Left eye -->
  <circle cx="178" cy="182" r="20" fill="#0f172a" />
  <circle cx="178" cy="182" r="15" fill="#1e1b4b" />
  <!-- Slit pupil -->
  <ellipse cx="178" cy="182" rx="4" ry="12" fill="#0f172a" />
  <ellipse cx="178" cy="182" rx="10" ry="12" fill="#f472b6" filter="url(#glow)" opacity="0.9" />
  <ellipse cx="178" cy="182" rx="4" ry="12" fill="#0f172a" />
  <!-- Eye shine -->
  <circle cx="173" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="183" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Right eye -->
  <circle cx="222" cy="182" r="20" fill="#0f172a" />
  <circle cx="222" cy="182" r="15" fill="#1e1b4b" />
  <!-- Slit pupil -->
  <ellipse cx="222" cy="182" rx="4" ry="12" fill="#0f172a" />
  <ellipse cx="222" cy="182" rx="10" ry="12" fill="#f472b6" filter="url(#glow)" opacity="0.9" />
  <ellipse cx="222" cy="182" rx="4" ry="12" fill="#0f172a" />
  <!-- Eye shine -->
  <circle cx="217" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="227" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Nose -->
  <polygon points="200,202 194,210 206,210" fill="#f472b6" />
  <polygon points="200,206 194,210 206,210" fill="#ec4899" />

  <!-- Mouth -->
  <path d="M200,210 Q194,216 190,214" stroke="#6d28d9" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M200,210 Q206,216 210,214" stroke="#6d28d9" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Whiskers -->
  <line x1="162" y1="204" x2="188" y2="207" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="160" y1="210" x2="187" y2="211" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="160" y1="216" x2="187" y2="215" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="238" y1="204" x2="212" y2="207" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="240" y1="210" x2="213" y2="211" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>
  <line x1="240" y1="216" x2="213" y2="215" stroke="#c4b5fd" stroke-width="1.2" opacity="0.6"/>

  <!-- Small circuit dots (decorative) -->
  <g fill="#c4b5fd" opacity="0.5">
    <circle cx="88" cy="165" r="3"/>
    <circle cx="100" cy="155" r="2"/>
    <circle cx="78" cy="180" r="2.5"/>
    <line x1="88" y1="165" x2="100" y2="155" stroke="#c4b5fd" stroke-width="1"/>
    <line x1="88" y1="165" x2="78" y2="180" stroke="#c4b5fd" stroke-width="1"/>
    <circle cx="312" cy="165" r="3"/>
    <circle cx="300" cy="155" r="2"/>
    <circle cx="322" cy="180" r="2.5"/>
    <line x1="312" y1="165" x2="300" y2="155" stroke="#c4b5fd" stroke-width="1"/>
    <line x1="312" y1="165" x2="322" y2="180" stroke="#c4b5fd" stroke-width="1"/>
  </g>
</svg>
