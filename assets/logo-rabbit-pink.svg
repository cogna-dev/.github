<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="pr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <linearGradient id="pr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="pr-glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="190" fill="url(#pr-bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.42"/>

  <!-- Hex grid pattern (tech feel) -->
  <g stroke="#f43f5e" stroke-width="1.2" opacity="0.15" fill="none">
    <!-- Row 1 -->
    <polygon points="60,70 75,61 90,70 90,88 75,97 60,88"/>
    <polygon points="90,70 105,61 120,70 120,88 105,97 90,88"/>
    <!-- Row 2 (offset) -->
    <polygon points="75,97 90,88 105,97 105,115 90,124 75,115"/>
    <polygon points="105,97 120,88 135,97 135,115 120,124 105,115"/>
    <!-- Right side -->
    <polygon points="295,70 310,61 325,70 325,88 310,97 295,88"/>
    <polygon points="325,70 340,61 355,70 355,88 340,97 325,88"/>
    <polygon points="310,97 325,88 340,97 340,115 325,124 310,115"/>
  </g>

  <!-- Floating binary / code text -->
  <g font-family="monospace" font-size="12" fill="#f43f5e" opacity="0.22" font-weight="bold">
    <text x="38"  y="190">0b1011</text>
    <text x="312" y="180">0xFF</text>
    <text x="52"  y="305">10110</text>
    <text x="308" y="310">01001</text>
    <text x="82"  y="348">0x1A</text>
    <text x="285" y="345">0b101</text>
  </g>

  <!-- ===== THINKING RABBIT (left paw raised to chin, thoughtful) ===== -->

  <!-- Thought bubble (upper right) -->
  <circle cx="295" cy="118" r="5"  fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="308" cy="106" r="7"  fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="320" cy="92"  r="9"  fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="330" cy="76"  r="22" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" opacity="0.75"/>
  <text x="330" y="74" text-anchor="middle" font-family="monospace" font-size="9"
        fill="#f43f5e" opacity="0.85" font-weight="bold">010</text>
  <text x="330" y="84" text-anchor="middle" font-family="monospace" font-size="9"
        fill="#f43f5e" opacity="0.85" font-weight="bold">110</text>

  <!-- Tail -->
  <circle cx="200" cy="320" r="16" fill="#fda4af"/>
  <circle cx="200" cy="318" r="10" fill="#fff1f2" opacity="0.85"/>

  <!-- Body (compact sitting) -->
  <ellipse cx="200" cy="262" rx="55" ry="58" fill="url(#pr-body)"/>
  <!-- Belly -->
  <ellipse cx="200" cy="270" rx="33" ry="43" fill="#fff1f2"/>

  <!-- Right leg (resting) -->
  <ellipse cx="228" cy="318" rx="14" ry="20" fill="#fda4af"/>
  <ellipse cx="234" cy="332" rx="17" ry="9"  fill="#fb7185"/>

  <!-- Left leg (resting) -->
  <ellipse cx="172" cy="318" rx="14" ry="20" fill="#fda4af"/>
  <ellipse cx="166" cy="332" rx="17" ry="9"  fill="#fb7185"/>

  <!-- Right arm (resting at side) -->
  <path d="M250,268 C262,282 264,298 258,314" stroke="#fda4af" stroke-width="22" stroke-linecap="round" fill="none"/>
  <ellipse cx="256" cy="317" rx="16" ry="9" fill="#fb7185" transform="rotate(10,256,317)"/>

  <!-- Left arm: raised to cheek/chin (thinking pose) -->
  <path d="M148,265 C136,255 138,238 148,224" stroke="#fda4af" stroke-width="22" stroke-linecap="round" fill="none"/>
  <ellipse cx="150" cy="218" rx="16" ry="10" fill="#fb7185" transform="rotate(-15,150,218)"/>

  <!-- Head -->
  <ellipse cx="200" cy="178" rx="56" ry="51" fill="url(#pr-body)"/>

  <!-- Ears (one slightly forward, one slightly back — contemplative) -->
  <ellipse cx="172" cy="104" rx="21" ry="66" fill="#fda4af"/>
  <ellipse cx="172" cy="104" rx="11" ry="52" fill="#ffe4e6"/>
  <!-- Right ear tilted slightly inward (thoughtful) -->
  <ellipse cx="228" cy="104" rx="21" ry="66" fill="#fda4af" transform="rotate(-8,228,155)"/>
  <ellipse cx="228" cy="104" rx="11" ry="52" fill="#ffe4e6" transform="rotate(-8,228,155)"/>

  <!-- Cheeks -->
  <circle cx="163" cy="191" r="17" fill="#f43f5e" opacity="0.27"/>
  <circle cx="237" cy="191" r="17" fill="#f43f5e" opacity="0.27"/>

  <!-- Left eye (looking slightly upward/sideways — thinking) -->
  <circle cx="179" cy="175" r="19" fill="#1c1917"/>
  <circle cx="179" cy="175" r="14" fill="#292524"/>
  <circle cx="179" cy="175" r="9"  fill="#f472b6" filter="url(#pr-glow)"/>
  <circle cx="179" cy="175" r="5"  fill="#be185d"/>
  <!-- Pupil shifted slightly up-right (looking upward in thought) -->
  <circle cx="181" cy="173" r="2.5" fill="#1c1917"/>
  <circle cx="172" cy="169" r="3.5" fill="white" opacity="0.95"/>
  <circle cx="184" cy="181" r="1.8" fill="white" opacity="0.45"/>

  <!-- Right eye -->
  <circle cx="221" cy="175" r="19" fill="#1c1917"/>
  <circle cx="221" cy="175" r="14" fill="#292524"/>
  <circle cx="221" cy="175" r="9"  fill="#f472b6" filter="url(#pr-glow)"/>
  <circle cx="221" cy="175" r="5"  fill="#be185d"/>
  <!-- Pupil shifted up-left -->
  <circle cx="219" cy="173" r="2.5" fill="#1c1917"/>
  <circle cx="214" cy="169" r="3.5" fill="white" opacity="0.95"/>
  <circle cx="226" cy="181" r="1.8" fill="white" opacity="0.45"/>

  <!-- Nose -->
  <ellipse cx="200" cy="196" rx="6" ry="5" fill="#f43f5e"/>

  <!-- Gentle smile (thoughtful expression) -->
  <path d="M190,208 Q200,218 210,208" stroke="#be185d" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="157" y1="199" x2="188" y2="201" stroke="#f43f5e" stroke-width="1.5" opacity="0.4"/>
  <line x1="155" y1="206" x2="187" y2="207" stroke="#f43f5e" stroke-width="1.5" opacity="0.4"/>
  <line x1="243" y1="199" x2="212" y2="201" stroke="#f43f5e" stroke-width="1.5" opacity="0.4"/>
  <line x1="245" y1="206" x2="213" y2="207" stroke="#f43f5e" stroke-width="1.5" opacity="0.4"/>
</svg>
