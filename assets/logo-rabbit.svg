<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff7ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffedd5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fed7aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdba74;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="earGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Warm background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#fb923c" stroke-width="4" opacity="0.6" />

  <!-- Sparkles -->
  <g fill="#fb923c" opacity="0.5">
    <circle cx="80" cy="100" r="4"/>
    <circle cx="320" cy="100" r="4"/>
    <circle cx="70" cy="130" r="2.5"/>
    <circle cx="330" cy="130" r="2.5"/>
    <circle cx="95" cy="85" r="2"/>
    <circle cx="305" cy="85" r="2"/>
  </g>
  <!-- Star sparkles -->
  <g fill="#fbbf24" opacity="0.7">
    <polygon points="88,70 91,62 94,70 102,70 96,75 98,83 91,78 84,83 86,75 80,70" transform="scale(0.55) translate(73,55)"/>
    <polygon points="312,70 315,62 318,70 326,70 320,75 322,83 315,78 308,83 310,75 304,70" transform="scale(0.55) translate(-28,55)"/>
  </g>

  <!-- ===== CUTE BRIGHT RABBIT ===== -->

  <!-- Body -->
  <ellipse cx="200" cy="278" rx="62" ry="68" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- Belly (lighter) -->
  <ellipse cx="200" cy="288" rx="38" ry="50" fill="#fff7ed" />

  <!-- Fluffy tail -->
  <circle cx="200" cy="340" r="18" fill="#fdba74" />
  <circle cx="200" cy="338" r="12" fill="#fed7aa" opacity="0.9"/>

  <!-- Front legs/paws -->
  <ellipse cx="168" cy="330" rx="15" ry="22" fill="#fdba74" />
  <ellipse cx="232" cy="330" rx="15" ry="22" fill="#fdba74" />
  <ellipse cx="168" cy="348" rx="18" ry="9" fill="#fb923c" />
  <ellipse cx="232" cy="348" rx="18" ry="9" fill="#fb923c" />
  <!-- Toe lines -->
  <g stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <line x1="162" y1="350" x2="162" y2="355"/>
    <line x1="168" y1="352" x2="168" y2="357"/>
    <line x1="174" y1="350" x2="174" y2="355"/>
    <line x1="226" y1="350" x2="226" y2="355"/>
    <line x1="232" y1="352" x2="232" y2="357"/>
    <line x1="238" y1="350" x2="238" y2="355"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="188" rx="60" ry="56" fill="url(#bodyGrad)" />

  <!-- Long rabbit ears -->
  <!-- Left ear outer -->
  <ellipse cx="172" cy="112" rx="22" ry="68" fill="#fdba74" />
  <!-- Left ear inner -->
  <ellipse cx="172" cy="112" rx="12" ry="54" fill="#fda4af" />
  <!-- Right ear outer -->
  <ellipse cx="228" cy="112" rx="22" ry="68" fill="#fdba74" />
  <!-- Right ear inner -->
  <ellipse cx="228" cy="112" rx="12" ry="54" fill="#fda4af" />

  <!-- Rosy cheeks -->
  <circle cx="162" cy="200" r="18" fill="#fb7185" opacity="0.35"/>
  <circle cx="238" cy="200" r="18" fill="#fb7185" opacity="0.35"/>

  <!-- Left eye (big, cute, sparkling) -->
  <circle cx="180" cy="182" r="20" fill="#1c1917" />
  <circle cx="180" cy="182" r="15" fill="#292524" />
  <circle cx="180" cy="182" r="10" fill="#f97316" filter="url(#glow)" />
  <circle cx="180" cy="182" r="6" fill="#c2410c" />
  <circle cx="180" cy="182" r="3" fill="#1c1917" />
  <!-- Eye shine -->
  <circle cx="174" cy="176" r="4" fill="white" opacity="0.95" />
  <circle cx="184" cy="188" r="2" fill="white" opacity="0.5" />

  <!-- Right eye -->
  <circle cx="220" cy="182" r="20" fill="#1c1917" />
  <circle cx="220" cy="182" r="15" fill="#292524" />
  <circle cx="220" cy="182" r="10" fill="#f97316" filter="url(#glow)" />
  <circle cx="220" cy="182" r="6" fill="#c2410c" />
  <circle cx="220" cy="182" r="3" fill="#1c1917" />
  <!-- Eye shine -->
  <circle cx="214" cy="176" r="4" fill="white" opacity="0.95" />
  <circle cx="224" cy="188" r="2" fill="white" opacity="0.5" />

  <!-- Nose (cute button nose) -->
  <ellipse cx="200" cy="204" rx="7" ry="5" fill="#f43f5e" />
  <circle cx="198" cy="202" r="2" fill="#fb7185" opacity="0.6"/>

  <!-- Big smile! -->
  <path d="M188,214 Q200,228 212,214" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="156" y1="206" x2="188" y2="208" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
  <line x1="154" y1="212" x2="187" y2="213" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
  <line x1="244" y1="206" x2="212" y2="208" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>
  <line x1="246" y1="212" x2="213" y2="213" stroke="#f97316" stroke-width="1.5" opacity="0.5"/>

  <!-- Heart accent -->
  <g transform="translate(310,230)" fill="#f43f5e" opacity="0.6">
    <path d="M0,-8 C-5,-14 -14,-14 -14,-6 C-14,0 0,10 0,10 C0,10 14,0 14,-6 C14,-14 5,-14 0,-8 Z" transform="scale(0.7)"/>
  </g>
  <g transform="translate(90,230)" fill="#f43f5e" opacity="0.6">
    <path d="M0,-8 C-5,-14 -14,-14 -14,-6 C-14,0 0,10 0,10 C0,10 14,0 14,-6 C14,-14 5,-14 0,-8 Z" transform="scale(0.7)"/>
  </g>
</svg>
