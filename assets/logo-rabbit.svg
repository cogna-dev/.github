<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#ffe8cc"/>
    </linearGradient>
    <linearGradient id="cr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd9b0"/>
      <stop offset="100%" stop-color="#fab870"/>
    </linearGradient>
    <filter id="cr-glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#cr-bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f97316" stroke-width="3" opacity="0.45"/>

  <!-- Circuit traces -->
  <g stroke="#f97316" stroke-width="1.5" opacity="0.22" fill="none">
    <path d="M18,158 H62 V118 H102"/>
    <path d="M382,158 H338 V118 H298"/>
    <path d="M18,258 H56 V298 H96"/>
    <path d="M382,258 H344 V298 H304"/>
    <circle cx="62" cy="158" r="4.5" fill="#f97316"/>
    <circle cx="62" cy="118" r="4.5" fill="#f97316"/>
    <circle cx="338" cy="158" r="4.5" fill="#f97316"/>
    <circle cx="338" cy="118" r="4.5" fill="#f97316"/>
    <circle cx="56"  cy="258" r="4.5" fill="#f97316"/>
    <circle cx="56"  cy="298" r="4.5" fill="#f97316"/>
    <circle cx="344" cy="258" r="4.5" fill="#f97316"/>
    <circle cx="344" cy="298" r="4.5" fill="#f97316"/>
  </g>

  <!-- </> code symbol (top) -->
  <text x="200" y="50" text-anchor="middle" font-family="monospace"
        font-size="22" fill="#f97316" opacity="0.38" font-weight="bold">&lt;/&gt;</text>

  <!-- Tail -->
  <circle cx="200" cy="322" r="17" fill="#fab870"/>
  <circle cx="200" cy="320" r="10" fill="#fff3e8" opacity="0.85"/>

  <!-- Body -->
  <ellipse cx="200" cy="260" rx="57" ry="62" fill="url(#cr-body)"/>
  <!-- Belly -->
  <ellipse cx="200" cy="268" rx="35" ry="46" fill="#fff8f0"/>

  <!-- LEFT arm: extended forward to keyboard -->
  <path d="M150,270 C133,288 120,306 116,320" stroke="#fab870" stroke-width="24" stroke-linecap="round" fill="none"/>
  <ellipse cx="113" cy="322" rx="18" ry="10" fill="#f97316"/>

  <!-- RIGHT arm: extended forward to keyboard -->
  <path d="M250,270 C267,288 280,306 284,320" stroke="#fab870" stroke-width="24" stroke-linecap="round" fill="none"/>
  <ellipse cx="287" cy="322" rx="18" ry="10" fill="#f97316"/>

  <!-- Keyboard -->
  <rect x="106" y="328" width="188" height="40" rx="7" fill="#292524" opacity="0.88"/>
  <g fill="#6b7280" opacity="0.85">
    <rect x="114" y="335" width="11" height="7" rx="2"/>
    <rect x="129" y="335" width="11" height="7" rx="2"/>
    <rect x="144" y="335" width="11" height="7" rx="2"/>
    <rect x="159" y="335" width="11" height="7" rx="2"/>
    <rect x="174" y="335" width="11" height="7" rx="2"/>
    <rect x="189" y="335" width="11" height="7" rx="2"/>
    <rect x="204" y="335" width="11" height="7" rx="2"/>
    <rect x="219" y="335" width="11" height="7" rx="2"/>
    <rect x="234" y="335" width="11" height="7" rx="2"/>
    <rect x="249" y="335" width="11" height="7" rx="2"/>
    <rect x="264" y="335" width="22" height="7" rx="2"/>
    <!-- space bar -->
    <rect x="148" y="347" width="104" height="7" rx="2"/>
    <rect x="256" y="347" width="30" height="7" rx="2"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="179" rx="57" ry="52" fill="url(#cr-body)"/>

  <!-- Ears (both upright — attentive) -->
  <ellipse cx="172" cy="104" rx="21" ry="66" fill="#fab870"/>
  <ellipse cx="172" cy="104" rx="11" ry="52" fill="#fda4af"/>
  <ellipse cx="228" cy="104" rx="21" ry="66" fill="#fab870"/>
  <ellipse cx="228" cy="104" rx="11" ry="52" fill="#fda4af"/>

  <!-- Cheeks -->
  <circle cx="163" cy="191" r="17" fill="#fb7185" opacity="0.28"/>
  <circle cx="237" cy="191" r="17" fill="#fb7185" opacity="0.28"/>

  <!-- Left eye -->
  <circle cx="179" cy="176" r="19" fill="#1c1917"/>
  <circle cx="179" cy="176" r="14" fill="#292524"/>
  <circle cx="179" cy="176" r="9"  fill="#f97316" filter="url(#cr-glow)"/>
  <circle cx="179" cy="176" r="5"  fill="#c2410c"/>
  <circle cx="179" cy="176" r="2.5" fill="#1c1917"/>
  <circle cx="173" cy="170" r="3.5" fill="white" opacity="0.95"/>
  <circle cx="183" cy="182" r="1.8" fill="white" opacity="0.45"/>

  <!-- Right eye -->
  <circle cx="221" cy="176" r="19" fill="#1c1917"/>
  <circle cx="221" cy="176" r="14" fill="#292524"/>
  <circle cx="221" cy="176" r="9"  fill="#f97316" filter="url(#cr-glow)"/>
  <circle cx="221" cy="176" r="5"  fill="#c2410c"/>
  <circle cx="221" cy="176" r="2.5" fill="#1c1917"/>
  <circle cx="215" cy="170" r="3.5" fill="white" opacity="0.95"/>
  <circle cx="225" cy="182" r="1.8" fill="white" opacity="0.45"/>

  <!-- Nose -->
  <ellipse cx="200" cy="196" rx="6" ry="5" fill="#f43f5e"/>

  <!-- Big smile -->
  <path d="M188,208 Q200,222 212,208" stroke="#e04020" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="157" y1="199" x2="188" y2="201" stroke="#f97316" stroke-width="1.5" opacity="0.42"/>
  <line x1="155" y1="206" x2="187" y2="207" stroke="#f97316" stroke-width="1.5" opacity="0.42"/>
  <line x1="243" y1="199" x2="212" y2="201" stroke="#f97316" stroke-width="1.5" opacity="0.42"/>
  <line x1="245" y1="206" x2="213" y2="207" stroke="#f97316" stroke-width="1.5" opacity="0.42"/>
</svg>
