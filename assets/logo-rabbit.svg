<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5" />

  <!-- Subtle grid / code pattern in background -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
    <line x1="60" y1="340" x2="340" y2="340"/>
    <line x1="60" y1="60" x2="60" y2="340"/>
    <line x1="340" y1="60" x2="340" y2="340"/>
  </g>

  <!-- Small decorative code brackets -->
  <text x="52" y="215" font-family="monospace" font-size="36" fill="#38bdf8" opacity="0.25" font-weight="bold">{</text>
  <text x="330" y="215" font-family="monospace" font-size="36" fill="#38bdf8" opacity="0.25" font-weight="bold">}</text>

  <!-- ===== RABBIT BODY ===== -->

  <!-- Main body -->
  <ellipse cx="200" cy="275" rx="60" ry="70" fill="url(#bodyGrad)" />

  <!-- Belly -->
  <ellipse cx="200" cy="285" rx="36" ry="50" fill="url(#bellyGrad)" />

  <!-- Fluffy tail -->
  <circle cx="200" cy="338" r="16" fill="#f1f5f9" />
  <circle cx="200" cy="338" r="10" fill="white" opacity="0.8" />

  <!-- Front legs / paws -->
  <ellipse cx="170" cy="330" rx="14" ry="20" fill="#cbd5e1" />
  <ellipse cx="230" cy="330" rx="14" ry="20" fill="#cbd5e1" />
  <!-- Paws -->
  <ellipse cx="170" cy="346" rx="16" ry="8" fill="#94a3b8" />
  <ellipse cx="230" cy="346" rx="16" ry="8" fill="#94a3b8" />

  <!-- Head -->
  <ellipse cx="200" cy="186" rx="56" ry="52" fill="url(#bodyGrad)" />

  <!-- Long rabbit ears (left) -->
  <ellipse cx="175" cy="118" rx="20" ry="62" fill="#cbd5e1" />
  <ellipse cx="175" cy="118" rx="12" ry="52" fill="#fda4af" opacity="0.6" />

  <!-- Long rabbit ears (right) -->
  <ellipse cx="225" cy="118" rx="20" ry="62" fill="#cbd5e1" />
  <ellipse cx="225" cy="118" rx="12" ry="52" fill="#fda4af" opacity="0.6" />

  <!-- Cheek fluff -->
  <circle cx="168" cy="200" r="16" fill="#f1f5f9" opacity="0.6"/>
  <circle cx="232" cy="200" r="16" fill="#f1f5f9" opacity="0.6"/>

  <!-- Left eye -->
  <circle cx="181" cy="182" r="18" fill="#0f172a" />
  <circle cx="181" cy="182" r="14" fill="#1e293b" />
  <circle cx="181" cy="182" r="9" fill="#f472b6" filter="url(#glow)" />
  <circle cx="181" cy="182" r="5" fill="#db2777" />
  <circle cx="181" cy="182" r="2.5" fill="#831843" />
  <!-- Eye shine -->
  <circle cx="176" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="185" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Right eye -->
  <circle cx="219" cy="182" r="18" fill="#0f172a" />
  <circle cx="219" cy="182" r="14" fill="#1e293b" />
  <circle cx="219" cy="182" r="9" fill="#f472b6" filter="url(#glow)" />
  <circle cx="219" cy="182" r="5" fill="#db2777" />
  <circle cx="219" cy="182" r="2.5" fill="#831843" />
  <!-- Eye shine -->
  <circle cx="214" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="223" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Nose -->
  <polygon points="200,200 194,207 206,207" fill="#fda4af" />
  <polygon points="200,204 194,207 206,207" fill="#fb7185" />

  <!-- Mouth -->
  <path d="M200,207 Q194,213 190,211" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M200,207 Q206,213 210,211" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Whiskers -->
  <line x1="160" y1="202" x2="186" y2="204" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
  <line x1="158" y1="208" x2="185" y2="208" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
  <line x1="240" y1="202" x2="214" y2="204" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>
  <line x1="242" y1="208" x2="215" y2="208" stroke="#64748b" stroke-width="1.2" opacity="0.5"/>

  <!-- Small circuit dots (decorative) -->
  <g fill="#7dd3fc" opacity="0.5">
    <circle cx="88" cy="165" r="3"/>
    <circle cx="100" cy="155" r="2"/>
    <circle cx="78" cy="180" r="2.5"/>
    <line x1="88" y1="165" x2="100" y2="155" stroke="#7dd3fc" stroke-width="1"/>
    <line x1="88" y1="165" x2="78" y2="180" stroke="#7dd3fc" stroke-width="1"/>
    <circle cx="312" cy="165" r="3"/>
    <circle cx="300" cy="155" r="2"/>
    <circle cx="322" cy="180" r="2.5"/>
    <line x1="312" y1="165" x2="300" y2="155" stroke="#7dd3fc" stroke-width="1"/>
    <line x1="312" y1="165" x2="322" y2="180" stroke="#7dd3fc" stroke-width="1"/>
  </g>
</svg>
