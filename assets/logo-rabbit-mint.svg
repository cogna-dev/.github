<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#bbf7d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10b981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Mint background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#34d399" stroke-width="4" opacity="0.7" />

  <!-- Clover/leaf decorations -->
  <g opacity="0.55">
    <!-- Left clover -->
    <circle cx="85" cy="155" r="8" fill="#34d399"/>
    <circle cx="73" cy="148" r="8" fill="#34d399"/>
    <circle cx="73" cy="162" r="8" fill="#34d399"/>
    <circle cx="97" cy="162" r="8" fill="#34d399"/>
    <circle cx="97" cy="148" r="8" fill="#34d399"/>
    <!-- Right clover -->
    <circle cx="315" cy="155" r="8" fill="#34d399"/>
    <circle cx="303" cy="148" r="8" fill="#34d399"/>
    <circle cx="303" cy="162" r="8" fill="#34d399"/>
    <circle cx="327" cy="162" r="8" fill="#34d399"/>
    <circle cx="327" cy="148" r="8" fill="#34d399"/>
  </g>
  <!-- Clover stems -->
  <line x1="85" y1="163" x2="85" y2="180" stroke="#16a34a" stroke-width="2" opacity="0.5"/>
  <line x1="315" y1="163" x2="315" y2="180" stroke="#16a34a" stroke-width="2" opacity="0.5"/>

  <!-- Small flowers around -->
  <g opacity="0.5">
    <circle cx="76" cy="240" r="5" fill="#fbbf24"/>
    <circle cx="68" cy="233" r="4" fill="#fde68a"/>
    <circle cx="84" cy="233" r="4" fill="#fde68a"/>
    <circle cx="68" cy="247" r="4" fill="#fde68a"/>
    <circle cx="84" cy="247" r="4" fill="#fde68a"/>
    <circle cx="76" cy="240" r="3" fill="white"/>
    <circle cx="324" cy="240" r="5" fill="#fbbf24"/>
    <circle cx="316" cy="233" r="4" fill="#fde68a"/>
    <circle cx="332" cy="233" r="4" fill="#fde68a"/>
    <circle cx="316" cy="247" r="4" fill="#fde68a"/>
    <circle cx="332" cy="247" r="4" fill="#fde68a"/>
    <circle cx="324" cy="240" r="3" fill="white"/>
  </g>

  <!-- ===== MINT GREEN RABBIT ===== -->

  <!-- Body -->
  <ellipse cx="200" cy="278" rx="62" ry="68" fill="url(#bodyGrad)" filter="url(#softShadow)"/>
  <!-- Belly -->
  <ellipse cx="200" cy="288" rx="38" ry="50" fill="#f0fdf4" />
  <!-- Fluffy tail -->
  <circle cx="200" cy="340" r="18" fill="#6ee7b7" />
  <circle cx="200" cy="338" r="12" fill="#bbf7d0" opacity="0.9"/>

  <!-- Front legs -->
  <ellipse cx="168" cy="330" rx="15" ry="22" fill="#6ee7b7" />
  <ellipse cx="232" cy="330" rx="15" ry="22" fill="#6ee7b7" />
  <ellipse cx="168" cy="348" rx="18" ry="9" fill="#34d399" />
  <ellipse cx="232" cy="348" rx="18" ry="9" fill="#34d399" />
  <g stroke="#059669" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6">
    <line x1="162" y1="350" x2="162" y2="355"/>
    <line x1="168" y1="352" x2="168" y2="357"/>
    <line x1="174" y1="350" x2="174" y2="355"/>
    <line x1="226" y1="350" x2="226" y2="355"/>
    <line x1="232" y1="352" x2="232" y2="357"/>
    <line x1="238" y1="350" x2="238" y2="355"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="188" rx="60" ry="56" fill="url(#bodyGrad)" />

  <!-- Long rabbit ears (one droopy for extra cuteness) -->
  <!-- Left ear (upright) -->
  <ellipse cx="175" cy="112" rx="22" ry="68" fill="#6ee7b7" />
  <ellipse cx="175" cy="112" rx="12" ry="54" fill="#fda4af" />
  <!-- Right ear (slightly drooped) -->
  <ellipse cx="225" cy="120" rx="22" ry="68" fill="#6ee7b7" transform="rotate(18,225,168)"/>
  <ellipse cx="225" cy="120" rx="12" ry="54" fill="#fda4af" transform="rotate(18,225,168)"/>

  <!-- Small flower on left ear -->
  <g transform="translate(175,80)" opacity="0.9">
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <circle cx="-8" cy="-4" r="5" fill="#fde68a"/>
    <circle cx="8" cy="-4" r="5" fill="#fde68a"/>
    <circle cx="-8" cy="4" r="5" fill="#fde68a"/>
    <circle cx="8" cy="4" r="5" fill="#fde68a"/>
    <circle cx="0" cy="0" r="3.5" fill="white"/>
  </g>

  <!-- Rosy cheeks -->
  <circle cx="162" cy="200" r="18" fill="#fb7185" opacity="0.3"/>
  <circle cx="238" cy="200" r="18" fill="#fb7185" opacity="0.3"/>

  <!-- Left eye -->
  <circle cx="180" cy="182" r="20" fill="#1c1917" />
  <circle cx="180" cy="182" r="15" fill="#292524" />
  <circle cx="180" cy="182" r="10" fill="#34d399" filter="url(#glow)" />
  <circle cx="180" cy="182" r="6" fill="#059669" />
  <circle cx="180" cy="182" r="3" fill="#1c1917" />
  <circle cx="174" cy="176" r="4" fill="white" opacity="0.95" />
  <circle cx="184" cy="188" r="2" fill="white" opacity="0.5" />

  <!-- Right eye (slightly squinted for extra cute expression) -->
  <circle cx="220" cy="182" r="20" fill="#1c1917" />
  <circle cx="220" cy="182" r="15" fill="#292524" />
  <circle cx="220" cy="182" r="10" fill="#34d399" filter="url(#glow)" />
  <circle cx="220" cy="182" r="6" fill="#059669" />
  <circle cx="220" cy="182" r="3" fill="#1c1917" />
  <circle cx="214" cy="176" r="4" fill="white" opacity="0.95" />
  <circle cx="224" cy="188" r="2" fill="white" opacity="0.5" />
  <!-- Squint line on right eye -->
  <path d="M208,173 Q220,168 232,173" stroke="#6ee7b7" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose -->
  <ellipse cx="200" cy="204" rx="7" ry="5" fill="#f43f5e" />
  <circle cx="198" cy="202" r="2" fill="#fb7185" opacity="0.6"/>

  <!-- Big smile + dimples -->
  <path d="M186,214 Q200,230 214,214" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Dimples -->
  <circle cx="186" cy="214" r="2.5" fill="#34d399" opacity="0.6"/>
  <circle cx="214" cy="214" r="2.5" fill="#34d399" opacity="0.6"/>

  <!-- Whiskers -->
  <line x1="156" y1="206" x2="188" y2="208" stroke="#059669" stroke-width="1.5" opacity="0.5"/>
  <line x1="154" y1="212" x2="187" y2="213" stroke="#059669" stroke-width="1.5" opacity="0.5"/>
  <line x1="244" y1="206" x2="212" y2="208" stroke="#059669" stroke-width="1.5" opacity="0.5"/>
  <line x1="246" y1="212" x2="213" y2="213" stroke="#059669" stroke-width="1.5" opacity="0.5"/>
</svg>
