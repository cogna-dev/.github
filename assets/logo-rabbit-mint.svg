<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="mr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="mr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="mr-glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="190" fill="url(#mr-bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#10b981" stroke-width="3" opacity="0.45"/>

  <!-- { } code brackets (prominent, background) -->
  <text x="38"  y="222" font-family="monospace" font-size="52" fill="#10b981" opacity="0.18" font-weight="bold">{</text>
  <text x="332" y="222" font-family="monospace" font-size="52" fill="#10b981" opacity="0.18" font-weight="bold">}</text>

  <!-- WiFi-style signal arcs (upper right) -->
  <g stroke="#10b981" stroke-width="2.5" opacity="0.3" fill="none" stroke-linecap="round">
    <path d="M310,78 A28,28 0 0 1 338,78"/>
    <path d="M303,68 A42,42 0 0 1 345,68"/>
    <path d="M296,58 A56,56 0 0 1 352,58"/>
    <circle cx="324" cy="90" r="4" fill="#10b981"/>
  </g>

  <!-- Circuit traces (lower left) -->
  <g stroke="#10b981" stroke-width="1.4" opacity="0.22" fill="none">
    <path d="M22,288 H60 V325 H98"/>
    <circle cx="60"  cy="288" r="4" fill="#10b981"/>
    <circle cx="60"  cy="325" r="4" fill="#10b981"/>
    <path d="M22,325 H42 V360"/>
    <circle cx="42"  cy="325" r="3.5" fill="#10b981"/>
  </g>

  <!-- Small dot matrix pattern (upper left) -->
  <g fill="#10b981" opacity="0.2">
    <circle cx="68" cy="80" r="3.5"/>  <circle cx="84" cy="80" r="3.5"/>  <circle cx="100" cy="80" r="3.5"/>
    <circle cx="68" cy="95" r="3.5"/>  <circle cx="84" cy="95" r="3.5"/>  <circle cx="100" cy="95" r="3.5"/>
    <circle cx="68" cy="110" r="3.5"/> <circle cx="84" cy="110" r="3.5"/> <circle cx="100" cy="110" r="3.5"/>
  </g>

  <!-- ===== WAVING RABBIT (body leaned ~6 degrees left, right arm raised) ===== -->
  <g transform="rotate(-6, 200, 240)">
    <!-- Tail -->
    <circle cx="200" cy="322" r="16" fill="#6ee7b7"/>
    <circle cx="200" cy="320" r="10" fill="#f0fdf4" opacity="0.85"/>

    <!-- Body -->
    <ellipse cx="200" cy="262" rx="56" ry="60" fill="url(#mr-body)"/>
    <!-- Belly -->
    <ellipse cx="200" cy="270" rx="34" ry="44" fill="#f0fdf4"/>

    <!-- Left leg (standard) -->
    <ellipse cx="174" cy="322" rx="14" ry="20" fill="#6ee7b7"/>
    <ellipse cx="168" cy="336" rx="17" ry="9"  fill="#34d399"/>

    <!-- Right leg (standard) -->
    <ellipse cx="226" cy="322" rx="14" ry="20" fill="#6ee7b7"/>
    <ellipse cx="232" cy="336" rx="17" ry="9"  fill="#34d399"/>

    <!-- Left arm (resting at side) -->
    <path d="M150,272 C142,285 140,300 144,314" stroke="#6ee7b7" stroke-width="22" stroke-linecap="round" fill="none"/>
    <ellipse cx="144" cy="317" rx="16" ry="9" fill="#34d399" transform="rotate(-5,144,317)"/>

    <!-- Right arm: RAISED HIGH in wave -->
    <path d="M250,268 C262,252 270,230 264,210" stroke="#6ee7b7" stroke-width="22" stroke-linecap="round" fill="none"/>
    <ellipse cx="262" cy="205" rx="16" ry="10" fill="#34d399" transform="rotate(35,262,205)"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="56" ry="51" fill="url(#mr-body)"/>

    <!-- Ears: left upright, right slightly tilted (from body lean) -->
    <ellipse cx="172" cy="105" rx="21" ry="66" fill="#6ee7b7"/>
    <ellipse cx="172" cy="105" rx="11" ry="52" fill="#fda4af"/>
    <ellipse cx="228" cy="105" rx="21" ry="66" fill="#6ee7b7" transform="rotate(5,228,155)"/>
    <ellipse cx="228" cy="105" rx="11" ry="52" fill="#fda4af" transform="rotate(5,228,155)"/>

    <!-- Cheeks -->
    <circle cx="163" cy="192" r="17" fill="#fb7185" opacity="0.27"/>
    <circle cx="237" cy="192" r="17" fill="#fb7185" opacity="0.27"/>

    <!-- Left eye -->
    <circle cx="179" cy="177" r="19" fill="#1c1917"/>
    <circle cx="179" cy="177" r="14" fill="#292524"/>
    <circle cx="179" cy="177" r="9"  fill="#34d399" filter="url(#mr-glow)"/>
    <circle cx="179" cy="177" r="5"  fill="#059669"/>
    <circle cx="179" cy="177" r="2.5" fill="#1c1917"/>
    <circle cx="173" cy="171" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="183" cy="183" r="1.8" fill="white" opacity="0.45"/>

    <!-- Right eye -->
    <circle cx="221" cy="177" r="19" fill="#1c1917"/>
    <circle cx="221" cy="177" r="14" fill="#292524"/>
    <circle cx="221" cy="177" r="9"  fill="#34d399" filter="url(#mr-glow)"/>
    <circle cx="221" cy="177" r="5"  fill="#059669"/>
    <circle cx="221" cy="177" r="2.5" fill="#1c1917"/>
    <circle cx="215" cy="171" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="225" cy="183" r="1.8" fill="white" opacity="0.45"/>

    <!-- Nose -->
    <ellipse cx="200" cy="197" rx="6" ry="5" fill="#f43f5e"/>

    <!-- Friendly smile -->
    <path d="M188,209 Q200,223 212,209" stroke="#059669" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="157" y1="200" x2="188" y2="202" stroke="#10b981" stroke-width="1.5" opacity="0.42"/>
    <line x1="155" y1="207" x2="187" y2="208" stroke="#10b981" stroke-width="1.5" opacity="0.42"/>
    <line x1="243" y1="200" x2="212" y2="202" stroke="#10b981" stroke-width="1.5" opacity="0.42"/>
    <line x1="245" y1="207" x2="213" y2="208" stroke="#10b981" stroke-width="1.5" opacity="0.42"/>
  </g>
</svg>
