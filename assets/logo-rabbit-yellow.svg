<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="yr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fefce8"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="yr-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="yr-glow">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="200" cy="200" r="190" fill="url(#yr-bg)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.45"/>

  <!-- Speed lines (motion blur) on the left — rabbit moving right -->
  <g stroke="#fbbf24" stroke-width="2.5" opacity="0.35" stroke-linecap="round">
    <line x1="18"  y1="148" x2="75"  y2="148"/>
    <line x1="12"  y1="178" x2="70"  y2="178"/>
    <line x1="18"  y1="208" x2="72"  y2="208"/>
    <line x1="24"  y1="238" x2="75"  y2="238"/>
    <line x1="20"  y1="265" x2="68"  y2="265"/>
  </g>

  <!-- Binary digits (floating) -->
  <g font-family="monospace" font-size="13" fill="#f59e0b" opacity="0.28" font-weight="bold">
    <text x="310" y="80">0101</text>
    <text x="52"  y="108">1100</text>
    <text x="318" y="148">1010</text>
    <text x="42"  y="310">0011</text>
    <text x="306" y="320">1001</text>
    <text x="285" y="358">0110</text>
    <text x="98"  y="355">1011</text>
  </g>

  <!-- Circuit nodes (scatter) -->
  <g fill="#f59e0b" opacity="0.3">
    <circle cx="318" cy="98"  r="5"/>
    <circle cx="298" cy="108" r="3.5"/>
    <circle cx="340" cy="108" r="3.5"/>
    <circle cx="78"  cy="310" r="5"/>
    <circle cx="58"  cy="320" r="3.5"/>
    <circle cx="98"  cy="320" r="3.5"/>
  </g>
  <g stroke="#f59e0b" stroke-width="1.2" opacity="0.22" fill="none">
    <line x1="298" y1="108" x2="318" y2="98"/>
    <line x1="340" y1="108" x2="318" y2="98"/>
    <line x1="58"  y1="320" x2="78"  y2="310"/>
    <line x1="98"  y1="320" x2="78"  y2="310"/>
  </g>

  <!-- ===== LEAPING RABBIT — body tilted +15 degrees (dashing right) ===== -->
  <g transform="rotate(15, 200, 230)">
    <!-- Tail -->
    <circle cx="200" cy="324" r="16" fill="#fbbf24"/>
    <circle cx="200" cy="322" r="10" fill="#fefce8" opacity="0.85"/>

    <!-- Body -->
    <ellipse cx="200" cy="262" rx="56" ry="60" fill="url(#yr-body)"/>
    <!-- Belly -->
    <ellipse cx="200" cy="270" rx="34" ry="44" fill="#fefce8"/>

    <!-- Legs spread for mid-leap -->
    <!-- Back left leg (trailing) -->
    <ellipse cx="163" cy="318" rx="13" ry="22" fill="#fbbf24" transform="rotate(-35,163,318)"/>
    <ellipse cx="145" cy="328" rx="17" ry="9"  fill="#f59e0b"/>
    <!-- Back right leg (leading) -->
    <ellipse cx="237" cy="318" rx="13" ry="22" fill="#fbbf24" transform="rotate(35,237,318)"/>
    <ellipse cx="255" cy="328" rx="17" ry="9"  fill="#f59e0b"/>

    <!-- Front left arm (reaching forward) -->
    <path d="M150,268 C133,280 126,295 128,312" stroke="#fbbf24" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="126" cy="315" rx="16" ry="9" fill="#f59e0b" transform="rotate(10,126,315)"/>
    <!-- Front right arm (trailing behind) -->
    <path d="M250,268 C270,278 278,258 272,244" stroke="#fbbf24" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="272" cy="241" rx="16" ry="9" fill="#f59e0b" transform="rotate(-20,272,241)"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="56" ry="51" fill="url(#yr-body)"/>

    <!-- Ears swept BACK (both angled rearward relative to rabbit's direction) -->
    <ellipse cx="172" cy="106" rx="21" ry="66" fill="#fbbf24" transform="rotate(22,172,160)"/>
    <ellipse cx="172" cy="106" rx="11" ry="52" fill="#fda4af"  transform="rotate(22,172,160)"/>
    <ellipse cx="228" cy="106" rx="21" ry="66" fill="#fbbf24" transform="rotate(16,228,160)"/>
    <ellipse cx="228" cy="106" rx="11" ry="52" fill="#fda4af"  transform="rotate(16,228,160)"/>

    <!-- Cheeks -->
    <circle cx="163" cy="192" r="17" fill="#fb7185" opacity="0.28"/>
    <circle cx="237" cy="192" r="17" fill="#fb7185" opacity="0.28"/>

    <!-- Left eye (wide & excited) -->
    <circle cx="179" cy="177" r="19" fill="#1c1917"/>
    <circle cx="179" cy="177" r="14" fill="#292524"/>
    <circle cx="179" cy="177" r="9"  fill="#fbbf24" filter="url(#yr-glow)"/>
    <circle cx="179" cy="177" r="5"  fill="#b45309"/>
    <circle cx="179" cy="177" r="2.5" fill="#1c1917"/>
    <circle cx="173" cy="171" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="183" cy="183" r="1.8" fill="white" opacity="0.45"/>

    <!-- Right eye -->
    <circle cx="221" cy="177" r="19" fill="#1c1917"/>
    <circle cx="221" cy="177" r="14" fill="#292524"/>
    <circle cx="221" cy="177" r="9"  fill="#fbbf24" filter="url(#yr-glow)"/>
    <circle cx="221" cy="177" r="5"  fill="#b45309"/>
    <circle cx="221" cy="177" r="2.5" fill="#1c1917"/>
    <circle cx="215" cy="171" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="225" cy="183" r="1.8" fill="white" opacity="0.45"/>

    <!-- Nose -->
    <ellipse cx="200" cy="197" rx="6" ry="5" fill="#f43f5e"/>

    <!-- Excited open smile -->
    <path d="M187,209 Q200,226 213,209" stroke="#d97706" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="157" y1="200" x2="188" y2="202" stroke="#f59e0b" stroke-width="1.5" opacity="0.42"/>
    <line x1="155" y1="207" x2="187" y2="208" stroke="#f59e0b" stroke-width="1.5" opacity="0.42"/>
    <line x1="243" y1="200" x2="212" y2="202" stroke="#f59e0b" stroke-width="1.5" opacity="0.42"/>
    <line x1="245" y1="207" x2="213" y2="208" stroke="#f59e0b" stroke-width="1.5" opacity="0.42"/>
  </g>
</svg>
