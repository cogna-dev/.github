<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Solid background -->
  <rect width="400" height="400" fill="#0F172A"/>

  <!-- Badge circle -->
  <circle cx="200" cy="215" r="162" fill="#1E293B" stroke="#38BDF8" stroke-width="5.5"/>

  <!--
    RABBIT  (running left, viewed from side)
    Z-order: back-ear → front-ear → tail → all 4 legs → body → head → face
    All rabbit parts share: fill=#1E293B  stroke=#38BDF8  stroke-width="7"
    stroke-linecap="round"  stroke-linejoin="round"
    This "same fill" trick makes each later shape cleanly cover the junction of
    the shape beneath it, giving a single unified outline look.
  -->

  <!-- 1. Back ear (swept backward = tilted right) -->
  <ellipse cx="169" cy="126" rx="14" ry="55"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(16, 169, 126)"/>

  <!-- 2. Front ear (nearly upright, slight back-tilt) -->
  <ellipse cx="153" cy="123" rx="16" ry="57"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(5, 153, 123)"/>

  <!-- 3. Tail (half-hidden behind body which is drawn later) -->
  <circle cx="294" cy="236" r="24"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"/>

  <!-- 4. Front far leg (leading, most forward angle) -->
  <ellipse cx="193" cy="283" rx="15" ry="39"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(-33, 193, 283)"/>

  <!-- 5. Front near leg -->
  <ellipse cx="180" cy="286" rx="17" ry="43"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(-39, 180, 286)"/>

  <!-- 6. Back far leg (trailing, most rearward angle) -->
  <ellipse cx="248" cy="283" rx="15" ry="39"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(25, 248, 283)"/>

  <!-- 7. Back near leg -->
  <ellipse cx="235" cy="286" rx="17" ry="43"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(31, 235, 286)"/>

  <!-- 8. Body (covers tops of all legs and most of the tail) -->
  <ellipse cx="218" cy="243" rx="82" ry="55"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"
    stroke-linecap="round" stroke-linejoin="round"
    transform="rotate(-8, 218, 243)"/>

  <!-- 9. Head (covers neck/body junction and ear bases) -->
  <circle cx="147" cy="210" r="51"
    fill="#1E293B" stroke="#38BDF8" stroke-width="7"/>

  <!-- 10. Eye — solid filled dot -->
  <circle cx="113" cy="205" r="5.5" fill="#38BDF8"/>

  <!-- 11. Nose — small solid dot -->
  <circle cx="100" cy="218" r="3.5" fill="#38BDF8"/>

  <!-- Speed lines (behind rabbit = to the right) -->
  <line x1="310" y1="248" x2="337" y2="248" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="315" y1="260" x2="340" y2="260" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="318" y1="272" x2="339" y2="272" stroke="#7DD3FC" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="307" y1="237" x2="330" y2="237" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round"/>
</svg>
