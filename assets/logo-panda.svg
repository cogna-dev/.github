<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="190" fill="none" stroke="#34d399" stroke-width="3" opacity="0.5" />

  <!-- Subtle grid / code pattern in background -->
  <g opacity="0.07" stroke="#34d399" stroke-width="1">
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <line x1="60" y1="300" x2="340" y2="300"/>
    <line x1="60" y1="340" x2="340" y2="340"/>
    <line x1="60" y1="60" x2="60" y2="340"/>
    <line x1="340" y1="60" x2="340" y2="340"/>
  </g>

  <!-- Small decorative code brackets -->
  <text x="52" y="215" font-family="monospace" font-size="36" fill="#34d399" opacity="0.25" font-weight="bold">{</text>
  <text x="330" y="215" font-family="monospace" font-size="36" fill="#34d399" opacity="0.25" font-weight="bold">}</text>

  <!-- ===== PANDA BODY ===== -->

  <!-- Main body (white) -->
  <ellipse cx="200" cy="272" rx="68" ry="75" fill="url(#bodyGrad)" />

  <!-- Belly -->
  <ellipse cx="200" cy="282" rx="42" ry="55" fill="url(#bellyGrad)" />

  <!-- Arms / legs -->
  <!-- Left arm (black) -->
  <ellipse cx="148" cy="280" rx="26" ry="38" fill="#1e293b" />
  <!-- Right arm (black) -->
  <ellipse cx="252" cy="280" rx="26" ry="38" fill="#1e293b" />

  <!-- Lower legs (black) -->
  <ellipse cx="174" cy="336" rx="22" ry="16" fill="#1e293b" />
  <ellipse cx="226" cy="336" rx="22" ry="16" fill="#1e293b" />

  <!-- Head (white) -->
  <ellipse cx="200" cy="186" rx="64" ry="60" fill="url(#bodyGrad)" />

  <!-- Round ears (black) -->
  <circle cx="158" cy="140" r="28" fill="#1e293b" />
  <circle cx="242" cy="140" r="28" fill="#1e293b" />
  <!-- Inner ear highlights -->
  <circle cx="158" cy="140" r="14" fill="#334155" opacity="0.5"/>
  <circle cx="242" cy="140" r="14" fill="#334155" opacity="0.5"/>

  <!-- Eye patches (black) -->
  <ellipse cx="177" cy="182" rx="28" ry="24" fill="#1e293b" />
  <ellipse cx="223" cy="182" rx="28" ry="24" fill="#1e293b" />

  <!-- Left eye -->
  <circle cx="177" cy="182" r="16" fill="#0f172a" />
  <circle cx="177" cy="182" r="11" fill="#1e293b" />
  <circle cx="177" cy="182" r="8" fill="#34d399" filter="url(#glow)" />
  <circle cx="177" cy="182" r="4.5" fill="#059669" />
  <circle cx="177" cy="182" r="2" fill="#064e3b" />
  <!-- Eye shine -->
  <circle cx="172" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="182" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Right eye -->
  <circle cx="223" cy="182" r="16" fill="#0f172a" />
  <circle cx="223" cy="182" r="11" fill="#1e293b" />
  <circle cx="223" cy="182" r="8" fill="#34d399" filter="url(#glow)" />
  <circle cx="223" cy="182" r="4.5" fill="#059669" />
  <circle cx="223" cy="182" r="2" fill="#064e3b" />
  <!-- Eye shine -->
  <circle cx="218" cy="177" r="3" fill="white" opacity="0.9" />
  <circle cx="228" cy="187" r="1.5" fill="white" opacity="0.5" />

  <!-- Nose (black) -->
  <ellipse cx="200" cy="206" rx="12" ry="9" fill="#1e293b" />
  <ellipse cx="196" cy="203" rx="4" ry="3" fill="#334155" opacity="0.6"/>

  <!-- Mouth -->
  <path d="M200,215 Q193,222 188,219" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M200,215 Q207,222 212,219" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Bamboo decoration (tiny) -->
  <g opacity="0.6">
    <rect x="96" y="140" width="8" height="50" rx="4" fill="#34d399"/>
    <rect x="94" y="152" width="12" height="5" rx="2" fill="#059669"/>
    <rect x="94" y="168" width="12" height="5" rx="2" fill="#059669"/>
    <!-- Leaves -->
    <ellipse cx="88" cy="150" rx="12" ry="5" fill="#34d399" transform="rotate(-30,88,150)"/>
    <ellipse cx="110" cy="165" rx="12" ry="5" fill="#34d399" transform="rotate(20,110,165)"/>
  </g>

  <!-- Small circuit dots (decorative) -->
  <g fill="#6ee7b7" opacity="0.5">
    <circle cx="312" cy="165" r="3"/>
    <circle cx="300" cy="155" r="2"/>
    <circle cx="322" cy="180" r="2.5"/>
    <line x1="312" y1="165" x2="300" y2="155" stroke="#6ee7b7" stroke-width="1"/>
    <line x1="312" y1="165" x2="322" y2="180" stroke="#6ee7b7" stroke-width="1"/>
  </g>
</svg>
